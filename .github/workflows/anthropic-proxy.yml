name: Anthropic Proxy

on:
  repository_dispatch:
    types: [anthropic-request]

jobs:
  proxy:
    runs-on: ubuntu-latest
    steps:
      - name: Call Anthropic and callback
        run: |
          RESPONSE=$(curl -s https://api.anthropic.com/v1/messages \
            -H "x-api-key: ${{ secrets.ANTHROPIC_API_KEY }}" \
            -H "anthropic-version: 2023-06-01" \
            -H "content-type: application/json" \
            -d '${{ github.event.client_payload.body }}')
          
          curl -s -X POST "${{ github.event.client_payload.callback_url }}" \
            -H "Content-Type: application/json" \
            -H "X-Proxy-Secret: ${{ github.event.client_payload.secret }}" \
            -d "$RESPONSE"
