name: Anthropic Proxy

on:
  repository_dispatch:
    types: [anthropic-request]

jobs:
  proxy:
    runs-on: ubuntu-latest
    steps:
      - name: Call Anthropic API
        id: call
        run: |
          RESPONSE=$(curl -s https://api.anthropic.com/v1/messages \
            -H "x-api-key: ${{ secrets.ANTHROPIC_API_KEY }}" \
            -H "anthropic-version: 2023-06-01" \
            -H "content-type: application/json" \
            -d '${{ github.event.client_payload.body }}')
          echo "response<<EOF" >> $GITHUB_OUTPUT
          echo "$RESPONSE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send response back
        run: |
          curl -s -X POST "${{ github.event.client_payload.callback_url }}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ github.event.client_payload.secret }}" \
            -d '${{ steps.call.outputs.response }}'
